apiVersion: apps/v1
kind: Deployment
metadata:
  name: studenthub-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studenthub-mongo
  template:
    metadata:
      labels:
        app: studenthub-mongo
    spec:
      containers:
        - name: mongodb
          image: mongo:8
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: studenthub-mongo-pvc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studenthub-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studenthub-backend
  template:
    metadata:
      labels:
        app: studenthub-backend
    spec:
      containers:
        - name: backend
          image: gontlasanthoshkumar2005/studenthub-backend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: MONGODB_URI
              value: "mongodb://studenthub-mongo:27017/studenthub"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studenthub-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studenthub-frontend
  template:
    metadata:
      labels:
        app: studenthub-frontend
    spec:
      containers:
        - name: frontend
          image: gontlasanthoshkumar2005/studenthub-frontend:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5